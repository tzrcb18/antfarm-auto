name: 蚂蚁庄园答案推送
on:
  workflow_dispatch:
  schedule:
    # UTC时间，北京时间=UTC+8
    # 北京时间 01:00 → UTC 17:00
    - cron: '0 17 * * *'
    # 北京时间 03:00 → UTC 19:00
    - cron: '0 19 * * *'
    # 北京时间 05:00 → UTC 21:00
    - cron: '0 21 * * *'
    # 北京时间 07:00 → UTC 23:00
    - cron: '0 23 * * *'

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖 requests + beautifulsoup4
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 执行Python脚本
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: python antfarm.py
