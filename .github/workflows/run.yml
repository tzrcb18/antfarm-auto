name: 蚂蚁庄园答案推送
on:
  workflow_dispatch:
  schedule:
    # UTC时间，北京时间=UTC+8
    # 北京时间 01:00 → UTC 17:00
    - cron: '0 17 * * *'
    # 北京时间 03:00 → UTC 19:00
    - cron: '0 19 * * *'
    # 北京时间 05:00 → UTC 21:00
    - cron: '0 21 * * *'
    # 北京时间 07:00 → UTC 23:00

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false # 使用自己的PAT提交
          fetch-depth: 0

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖 requests + beautifulsoup4
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 执行Python脚本
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: python antfarm.py

      # 下面是新增：提交flag.txt标记文件回仓库
      - name: 提交标记文件
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flag.txt
          git commit -m "update flag ${{ github.sha }}" || echo "无变更无需提交"
          git push https://${PAT}@github.com/${{ github.repository }}.git
